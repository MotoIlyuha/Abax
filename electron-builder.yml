# appId прежний: по нему установщик узнаёт уже установленную Doska и обновляет её на месте
appId: ru.doska.app
productName: Abax
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Abax
