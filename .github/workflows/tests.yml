name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # бинарник Electron тестам не нужен: main-процесс проверяется с подменённым модулем electron
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test -- --coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # образ облачного ретранслятора собирается и отвечает на /health (сам код проверяет npm test)
  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t abax-relay relay
      - name: Контейнер запускается и отвечает
        run: |
          docker run -d --name relay -p 8080:8080 abax-relay
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs relay
          exit 1
