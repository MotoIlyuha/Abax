name: release

# Выпуск новой версии — вручную: Actions → release → Run workflow (с ветки main).
# Версия — из package.json, описание — release-notes/<версия>.md (строку <!-- files -->
# заменяет таблица файлов). Собирает Windows (установщик и переносная версия), веб-версию
# и, если в секретах репозитория есть ключ подписи, APK для Android; публикует релиз
# v<версия> с контрольными суммами. Приложение проверяет обновления по этим релизам
# и ищет файлы по именам: Abax.Setup.X.exe, Abax.X.exe, Abax-X.apk (см. src/updates.ts).
# Гостевой клиент совместной работы через интернет публикуется на GitHub Pages (pages.yml),
# веб-версия — на сайт https://abax-board.website.yandexcloud.net/ (site.yml; нужны секреты
# YC_S3_ACCESS_KEY_ID и YC_S3_SECRET_ACCESS_KEY — см. начало site.yml).
# Веб-клиент и сервер до создания релиза выкладываются на tutor.abaxboard.ru через
# ограниченный ключ ABAX_TUTOR_DEPLOY_SSH_KEY; затем workflow проверяет asset и API по HTTPS.
#
# Ключ подписи Android — тот же, что в ~/.abax/keystore.properties: иначе APK не встанет
# поверх прежней версии. Секреты: ABAX_KEYSTORE_BASE64 (файл ключа в base64),
# ABAX_KEYSTORE_PASSWORD, ABAX_KEY_ALIAS, ABAX_KEY_PASSWORD. Без них APK не собирается.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    env:
      TUTOR_DEPLOY_KEY: ${{ secrets.ABAX_TUTOR_DEPLOY_SSH_KEY }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Версия и описание
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then echo "::error::Релиз запускается только с main"; exit 1; fi
          if [ -z "$TUTOR_DEPLOY_KEY" ]; then echo "::error::Не настроен секрет ABAX_TUTOR_DEPLOY_SSH_KEY для обязательной выкладки Tutor"; exit 1; fi
          v=$(node -p "require('./package.json').version")
          if [ ! -f "release-notes/$v.md" ]; then echo "::error::Нет описания release-notes/$v.md"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "::error::Релиз v$v уже есть — поднимите версию в package.json"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      DOSKA_API_URL: https://board.abaxboard.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Скрипты пропускаем: better-sqlite3 (devDependency сервера, в клиентскую сборку не входит)
      # собирается из исходников и на раннере не находит Visual Studio. Клиенту нужен только
      # бинарник Electron — его ставим отдельно.
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      # --publish never: electron-builder сам ничего не выкладывает, релиз создаёт задача release
      - run: npm run dist -- --publish never
      - name: Файлы
        shell: bash
        run: |
          v=${{ needs.version.outputs.version }}
          mkdir out
          cp "release/Abax Setup $v.exe" "out/Abax.Setup.$v.exe"
          cp "release/Abax $v.exe" "out/Abax.$v.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/
          if-no-files-found: error

  web:
    needs: version
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DOSKA_API_URL: https://board.abaxboard.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run server:build
      - name: Артефакт для Tutor VPS
        uses: actions/upload-artifact@v4
        with:
          name: tutor-runtime
          path: |
            dist/
            dist-server/
          if-no-files-found: error
      - name: Архив
        run: |
          v=${{ needs.version.outputs.version }}
          mkdir out
          cp -r dist abax-web
          zip -r -X "out/Abax-$v-web.zip" abax-web
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: out/
          if-no-files-found: error

  tutor-vps:
    needs: [version, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tutor-runtime
          path: runtime
      - id: package
        name: Подготовить архив выкладки
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          printf 'version=%s\ncommit=%s\n' "$VERSION" "$COMMIT" > runtime/RELEASE
          expected=$(grep -oE 'assets/(index|board)-[A-Za-z0-9_-]+\.js' runtime/dist/index.html | head -n 1)
          test -n "$expected" || { echo "::error::В dist/index.html не найден основной скрипт"; exit 1; }
          if [[ "$expected" == assets/board-* ]]; then
            index_asset=${expected/board-/index-}
            cp "runtime/dist/$expected" "runtime/dist/$index_asset"
            sed -i "s|$expected|$index_asset|g" runtime/dist/index.html
            expected=$index_asset
          fi
          tar -czf "$RUNNER_TEMP/tutor-runtime.tar.gz" -C runtime dist dist-server RELEASE
          echo "asset=$expected" >> "$GITHUB_OUTPUT"
      - name: Выкатить Tutor на VPS
        env:
          DEPLOY_KEY: ${{ secrets.ABAX_TUTOR_DEPLOY_SSH_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tutor_deploy
          chmod 600 ~/.ssh/tutor_deploy
          cat deploy/tutor/known_hosts > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/tutor_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=130.12.217.206 \
            abax-tutor-deploy@tutor.abaxboard.ru "$VERSION" \
            < "$RUNNER_TEMP/tutor-runtime.tar.gz"
      - name: Проверить публичный Tutor и API
        env:
          EXPECTED_ASSET: ${{ steps.package.outputs.asset }}
        run: |
          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error https://tutor.abaxboard.ru/ -o "$RUNNER_TEMP/tutor.html" \
              && grep -Fq "$EXPECTED_ASSET" "$RUNNER_TEMP/tutor.html"; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true || { echo "::error::tutor.abaxboard.ru не отдаёт сборку $EXPECTED_ASSET"; exit 1; }
          api_status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://tutor.abaxboard.ru/api/tutor/snapshot)
          test "$api_status" = 401 || { echo "::error::API Tutor вернул неожиданный код $api_status"; exit 1; }
          echo "Tutor обновлён: $EXPECTED_ASSET; API отвечает с ожидаемой защитой авторизации."

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      KEYSTORE_BASE64: ${{ secrets.ABAX_KEYSTORE_BASE64 }}
      DOSKA_API_URL: https://board.abaxboard.ru
    steps:
      - id: key
        name: Ключ подписи
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Нет секрета ABAX_KEYSTORE_BASE64 — APK не собран (см. начало release.yml)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.key.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.key.outputs.ok == 'true'
        name: Сборка APK
        env:
          STORE_PASSWORD: ${{ secrets.ABAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ABAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ABAX_KEY_PASSWORD }}
        run: |
          v=${{ needs.version.outputs.version }}
          npm ci
          npm run build
          npx cap sync android
          mkdir -p "$RUNNER_TEMP/abax"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/abax/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/abax/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/abax/keystore.properties"
          (cd android && ./gradlew --no-daemon assembleRelease -PabaxKeystore="$RUNNER_TEMP/abax/keystore.properties")
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Abax-$v.apk"
      - if: steps.key.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: out/
          if-no-files-found: error

  # гостевой клиент совместной работы через интернет — до релиза: ссылки новой версии сразу работают
  pages:
    permissions:
      contents: write
    needs: [version, tutor-vps]
    uses: ./.github/workflows/pages.yml

  # сайт на Yandex Object Storage — до релиза: новая веб-версия уже доступна по постоянной ссылке
  site:
    needs: [version, tutor-vps]
    uses: ./.github/workflows/site.yml
    secrets: inherit

  release:
    permissions:
      contents: write
    needs: [version, windows, web, android, pages, site, tutor-vps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Описание
        run: |
          v=${{ needs.version.outputs.version }}
          row() { if [ -f "out/$2" ]; then echo "| $1 | \`$2\` |"; fi; }
          {
            echo '| Платформа | Файл |'
            echo '|---|---|'
            row 'Windows — установщик' "Abax.Setup.$v.exe"
            row 'Windows — без установки' "Abax.$v.exe"
            row 'Android (планшет)' "Abax-$v.apk"
            row 'Веб-версия' "Abax-$v-web.zip"
          } > files.md
          FILES="$(cat files.md)" awk '{ if ($0 == "<!-- files -->") print ENVIRON["FILES"]; else print }' "release-notes/$v.md" > body.md
          if [ "${{ needs.site.outputs.deployed }}" = "true" ]; then
            { echo; echo 'Веб-версия: https://abax-board.website.yandexcloud.net/'; } >> body.md
          fi
          prev=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          {
            echo
            echo '## Контрольные суммы SHA-256'
            echo
            echo '```'
            (cd out && sha256sum *)
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...v$v"
            fi
          } >> body.md
          cat body.md
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.version.outputs.version }}
          gh release create "v$v" out/* --title "Abax $v" --notes-file body.md --target "$GITHUB_SHA"

  publish-downloads:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Подготовить сведения и архив
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 deploy/downloads/prepare.py
      - name: Опубликовать на Abax
        env:
          DEPLOY_KEY: ${{ secrets.ABAX_DOWNLOADS_SSH_KEY }}
          HOST_KEY: ${{ secrets.ABAX_DOWNLOADS_HOST_KEY }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST_KEY" || { echo "::error::Не настроен доступ к серверу загрузок"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/abax_downloads
          chmod 600 ~/.ssh/abax_downloads
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/abax_downloads -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes abax-downloads@130.12.217.206 < downloads.tar
