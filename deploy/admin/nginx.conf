# Подключить в контексте http после получения сертификата.
server {
    listen 80;
    listen [::]:80;
    server_name admin.abaxboard.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/abax-acme; }
    location / { return 308 https://admin.abaxboard.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.abaxboard.ru;
    ssl_certificate /etc/letsencrypt/live/admin.abaxboard.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.abaxboard.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/abax-admin/current;
    index index.html;
    client_max_body_size 16k;

    # Поисковые строки могут содержать почту или идентификаторы платежей.
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    # Сохраняем точный Host и Origin браузера для проверки Node.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;

    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/auth/email/start {
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/auth/email/verify {
        proxy_pass http://127.0.0.1:8787;
    }

    location ^~ /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
