<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Доска</title>
</head>
<body>
  <div id="topbar">
    <button id="btn-home" class="icon" title="Проекты (домашняя страница)"></button>
    <span id="project-name" title="Текущий проект">Проект</span>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <input id="page-name" title="Название страницы" spellcheck="false" />
    <div class="sep"></div>
    <button id="btn-undo" class="icon" title="Отменить (Ctrl+Z)"></button>
    <button id="btn-redo" class="icon" title="Повторить (Ctrl+Y)"></button>
    <div class="sep"></div>
    <select id="grid-mode" title="Фон страницы">
      <option value="none">Без фона</option>
      <option value="dots">Точки</option>
      <option value="square" selected>Клетка</option>
      <option value="coord">Координатная плоскость</option>
    </select>
    <button id="btn-import" class="icon" title="Импорт PDF (домашка)"></button>
    <button id="btn-image" class="icon" title="Вставить изображение (или Ctrl+V / перетащить файл)"></button>
    <div class="topbar-right">
      <span id="zoom-label" title="Масштаб">100%</span>
      <button id="btn-fit" class="icon" title="Показать всё содержимое (0)"></button>
      <button id="btn-settings" class="icon" title="Настройки доски"></button>
      <button id="btn-present" class="icon" title="Окно для демонстрации экрана: только холст, без интерфейса"></button>
      <button id="btn-share" class="icon" title="Поделиться доской"></button>
      <button id="btn-export" class="icon" title="Экспорт в PNG (Ctrl+E)"></button>
    </div>
  </div>
  <div id="main">
    <div id="canvas-wrap">
      <div id="toolbar"></div>
      <canvas id="board"></canvas>
      <div id="overlay"></div>
      <div id="pages-dock" data-tip-side="top">
        <div id="pages-tray"><div id="pages-list"></div></div>
        <button id="btn-pages"></button>
      </div>
      <div id="ctx-layer"></div>
      <div id="quick-menu" hidden></div>
    </div>
  </div>
  <div id="settings-popover" hidden></div>
  <div id="home" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
